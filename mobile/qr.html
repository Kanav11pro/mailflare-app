<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mailflare Expo QR (SDK 57)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0f1015;
      color: #f1f3f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
    }
    .card {
      background-color: #15161b;
      border: 1px solid #252730;
      border-radius: 24px;
      padding: 36px 32px;
      text-align: center;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .badge {
      display: inline-block;
      background: rgba(59, 130, 246, 0.15);
      color: #3b82f6;
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 26px;
      font-weight: 800;
      color: #f1f3f5;
    }
    p.subtitle {
      color: #9ca3af;
      font-size: 14px;
      margin: 0 0 20px 0;
    }
    .qr-container {
      background: #ffffff;
      padding: 16px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      margin-bottom: 20px;
    }
    .qr-container svg {
      display: block;
      width: 280px;
      height: 280px;
    }
    .url-pill {
      background-color: #18191e;
      border: 1px solid #252730;
      border-radius: 12px;
      padding: 12px 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      color: #60a5fa;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: all;
      transition: border-color 0.2s;
    }
    .url-pill:hover {
      border-color: #3b82f6;
    }
    .instructions {
      color: #6b7280;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 18px;
      text-align: left;
      background: #111217;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #1e2027;
    }
    .instructions ol {
      margin: 6px 0 0 0;
      padding-left: 18px;
      color: #9ca3af;
    }
    .instructions li {
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">EXPO SDK 57</div>
    <h1>Mailflare Mobile</h1>
    <p class="subtitle">Scan to preview on your device</p>

    </div>

    <div class="url-pill" onclick="navigator.clipboard.writeText('exp://192.168.1.36:8081'); alert('Copied URL to clipboard!');">
      <span>exp://192.168.1.36:8081</span>
      <span style="font-size: 11px; color: #9ca3af;">(Click to copy)</span>
    </div>

    <div class="instructions">
      <strong style="color: #d1d5db;">How to open:</strong>
      <ol>
        <li>Open <b>Expo Go</b> app on your phone.</li>
        <li>Tap <b>Scan QR code</b> or enter URL manually: <code>exp://192.168.1.36:8081</code></li>
        <li>Ensure phone is connected to Wi-Fi <b>hgu_lan</b>.</li>
      </ol>
    </div>
  </div>
</body>
</html>
